<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行事曆｜個人行程與任務管理</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--paper:#fff;--ink:#20293a;--muted:#788397;--line:#e8edf4;--blue:#5669d8;--soft:#eef0ff;font-family:"Segoe UI","Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
.shell{width:min(1080px,calc(100% - 36px));margin:auto;padding:40px 0 60px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}h1{margin:0;font-size:2.5rem}.eyebrow{color:var(--blue);font-size:.78rem;letter-spacing:.12em;font-weight:bold}.sub,.note{color:var(--muted)}.date{padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.date span{display:block;color:var(--muted);font-size:.8rem}.date strong{display:block;margin-top:4px}
.columns{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px}.columns+.columns{margin-top:20px}.panel{min-width:0;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 28px #23314d0c}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h2{margin:0;font-size:1.15rem}.note{font-size:.85rem;margin:5px 0 0}.badge{flex:none;padding:6px 10px;border-radius:9px;background:var(--soft);color:var(--blue)}
.list{display:grid;gap:10px}.event{display:grid;grid-template-columns:60px 3px minmax(0,1fr) auto;gap:12px;align-items:center;min-width:0;padding:13px;border:1px solid var(--line);border-radius:13px}.time{color:var(--blue);font-weight:700;white-space:nowrap}.mark{height:40px;width:3px;border-radius:4px;background:var(--blue)}.event:nth-child(2) .mark{background:#51a68e}.event:nth-child(3) .mark{background:#e6a54f}h3{font-size:.94rem;margin:0;overflow-wrap:anywhere}.detail{margin:5px 0 0;color:var(--muted);font-size:.81rem;overflow-wrap:anywhere}.tag{padding:5px 9px;background:var(--soft);color:var(--blue);border-radius:20px;font-size:.73rem;white-space:nowrap}.event-content{min-width:0}.event-actions{grid-column:3/-1;display:flex;justify-content:flex-end;gap:8px}.edit-event,.save-event,.cancel-event{min-height:36px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue);font-size:.8rem;font-weight:650;cursor:pointer}.edit-event:hover,.save-event:hover{background:var(--soft)}.edit-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;padding-top:5px}.edit-fields label{display:grid;gap:5px;color:var(--muted);font-size:.78rem}.edit-fields label:first-child,.edit-fields label:last-child{grid-column:1/-1}.edit-fields input,.edit-fields select{width:100%;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}.event.is-editing{grid-template-columns:60px 3px minmax(0,1fr) auto}.event.is-editing .event-actions{grid-column:1/-1}.event[hidden],.task[hidden]{display:none}
.task-progress{margin:0 0 10px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fafbff}.progress-copy{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:.82rem}.progress-copy span{color:var(--muted)}.progress-copy strong{color:var(--blue)}.progress-track{height:9px;overflow:hidden;border-radius:99px;background:#e8ebf4}.progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5669d8,#51a68e);transition:width .25s ease}.task-list{display:grid}.task{display:flex;gap:12px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue)}.task-meta{display:block;margin-top:5px;color:var(--muted);font-size:.8rem}.task.is-complete .task-copy{text-decoration:line-through;color:var(--muted)}.task.is-complete .task-meta{text-decoration:none}.task.is-complete{order:1}.task:not(.is-complete){order:0}
.form-panel{margin-top:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px;min-width:0}.full{grid-column:1/-1}.field label{font-size:.84rem;font-weight:650}.field input,.field select,.field textarea{width:100%;min-width:0;padding:11px;border:1px solid #dfe5ee;border-radius:9px;background:white}.field textarea{min-height:75px;resize:vertical}.actions{display:flex;justify-content:flex-end;margin-top:16px}.submit{padding:11px 17px;border:0;border-radius:9px;background:var(--blue);color:#fff;cursor:pointer}.footnote{font-size:.8rem;color:var(--muted)}
@media(max-width:760px){.columns{grid-template-columns:minmax(0,1fr)}.shell{width:min(100% - 28px,600px);padding-top:28px}}
@media(max-width:480px){.shell{width:calc(100% - 24px);padding-top:22px}.head{align-items:stretch;flex-direction:column;gap:12px}h1{font-size:2rem}.sub{line-height:1.5}.date{display:flex;justify-content:space-between;align-items:center}.date strong{margin:0}.panel{padding:16px}.panel-title{align-items:flex-start}.note{line-height:1.45}.event{grid-template-columns:48px 3px minmax(0,1fr);gap:9px;padding:11px 9px}.event .tag{grid-column:3;justify-self:start}.event-actions{grid-column:3;justify-content:flex-start}.edit-fields{grid-template-columns:minmax(0,1fr)}.edit-fields label,.edit-fields label:first-child,.edit-fields label:last-child{grid-column:auto}.time{font-size:.82rem}.form-grid{grid-template-columns:minmax(0,1fr)}.full{grid-column:auto}.actions .submit{width:100%;min-height:44px}.task{line-height:1.45}}
@media(max-width:360px){.shell{width:calc(100% - 20px)}.panel{padding:13px}.event{grid-template-columns:44px 3px minmax(0,1fr);gap:7px;padding:10px 8px}.tag{font-size:.68rem;padding:5px 7px}.panel-title{gap:8px}.note{font-size:.78rem}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><p class="eyebrow">PERSONAL PLANNER</p><h1>行事曆</h1><p class="sub">安排今天的步調，讓每件事都更有條理。</p></div><div class="date"><span>今天</span><strong id="todayDate">載入日期中…</strong></div></header>
<div class="columns">
<section class="panel" aria-labelledby="scheduleHeading"><div class="panel-title"><div><h2 id="scheduleHeading">今日行程</h2><p class="note">可編輯行程時間、名稱、地點與類別</p></div><span class="badge" id="eventCount">3 筆</span></div><div class="list" id="scheduleList">
<article class="event" data-time="09:00" data-title="晨間規劃與閱讀" data-detail="在家 · 整理本週重點" data-category="個人"><time class="time">09:00</time><i class="mark" aria-hidden="true"></i><div class="event-content"><h3>晨間規劃與閱讀</h3><p class="detail">在家 · 整理本週重點</p></div><span class="tag">個人</span><div class="event-actions"><button class="edit-event" type="button" aria-label="編輯晨間規劃與閱讀">編輯</button></div></article>
<article class="event" data-time="13:30" data-title="專案進度討論" data-detail="會議室 A · 設計小組" data-category="工作"><time class="time">13:30</time><i class="mark" aria-hidden="true"></i><div class="event-content"><h3>專案進度討論</h3><p class="detail">會議室 A · 設計小組</p></div><span class="tag">工作</span><div class="event-actions"><button class="edit-event" type="button" aria-label="編輯專案進度討論">編輯</button></div></article>
<article class="event" data-time="18:00" data-title="晚餐與朋友聚會" data-detail="市區 · 記得預留交通時間" data-category="生活"><time class="time">18:00</time><i class="mark" aria-hidden="true"></i><div class="event-content"><h3>晚餐與朋友聚會</h3><p class="detail">市區 · 記得預留交通時間</p></div><span class="tag">生活</span><div class="event-actions"><button class="edit-event" type="button" aria-label="編輯晚餐與朋友聚會">編輯</button></div></article>
</div></section></div>
<div class="columns">
<section class="panel" aria-labelledby="tasksHeading"><div class="panel-title"><div><h2 id="tasksHeading">待辦事項</h2><p class="note">完成後勾選，追蹤處理狀態</p></div><span class="badge" id="taskCount">0 / 3</span></div>
<div class="task-progress"><div class="progress-copy"><span>今日完成度</span><strong id="progressLabel">0%</strong></div><div class="progress-track" id="progressTrack" role="progressbar" aria-label="待辦事項完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div></div>
<div class="task-list" id="taskList">
<label class="task"><input type="checkbox"><span class="task-copy">整理會議資料<span class="task-meta">重要 · 上午前</span></span></label>
<label class="task"><input type="checkbox"><span class="task-copy">回覆合作夥伴郵件<span class="task-meta">工作 · 今天</span></span></label>
<label class="task"><input type="checkbox"><span class="task-copy">採買日常用品<span class="task-meta">生活 · 下班後</span></span></label>
</div>
</section>
<section class="panel form-panel" aria-labelledby="formHeading"><div class="panel-title"><div><h2 id="formHeading">新增行程</h2><p class="note">填寫欄位以規劃新的安排</p></div></div>
<form><div class="form-grid">
<div class="field full"><label for="title">行程名稱</label><input id="title" type="text" placeholder="例如：團隊週會"></div>
<div class="field"><label for="date">日期</label><input id="date" type="date"></div>
<div class="field"><label for="category">行程類別</label><select id="category"><option value="">請選擇類別</option><option>工作</option><option>個人</option><option>生活</option></select></div>
<div class="field"><label for="start">開始時間</label><input id="start" type="time"></div>
<div class="field"><label for="end">結束時間</label><input id="end" type="time"></div>
<div class="field full"><label for="location">地點</label><input id="location" type="text" placeholder="輸入地點（選填）"></div>
<div class="field full"><label for="notes">備註</label><textarea id="notes" placeholder="補充說明（選填）"></textarea></div>
</div><div class="actions"><button class="submit" type="button">＋ 新增行程</button></div><p class="footnote">靜態畫面框架：表單按鈕僅呈現外觀，不會送出或儲存資料。</p></form></section></div>
</main>
<script>
// 顯示裝置的今天日期；不連線、不儲存資料。
document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());

// 行程可直接編輯時間、名稱、地點和類別；修改只在目前頁面生效。
const scheduleList=document.getElementById('scheduleList');
const eventCount=document.getElementById('eventCount');
const categories=['工作','個人','生活'];
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
scheduleList.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button)return;
  const card=button.closest('.event');
  if(button.classList.contains('edit-event')){
    const values={time:card.dataset.time,title:card.dataset.title,detail:card.dataset.detail,category:card.dataset.category};
    card.classList.add('is-editing');
    card.querySelector('.event-content').hidden=true;
    card.querySelector('.time').hidden=true;
    card.querySelector('.tag').hidden=true;
    card.querySelector('.event-actions').innerHTML='<button class="save-event" type="button">儲存修改</button><button class="cancel-event" type="button">取消</button>';
    card.insertAdjacentHTML('beforeend',`<div class="edit-fields"><label>時間<input data-field="time" type="time" value="${escapeHtml(values.time)}" required></label><label>類別<select data-field="category">${categories.map(category=>`<option${category===values.category?' selected':''}>${category}</option>`).join('')}</select></label><label>行程名稱<input data-field="title" type="text" maxlength="60" value="${escapeHtml(values.title)}" required></label><label>地點與備註<input data-field="detail" type="text" maxlength="120" value="${escapeHtml(values.detail)}"></label></div>`);
    card.querySelector('[data-field="title"]').focus();
    return;
  }
  if(button.classList.contains('cancel-event')){
    card.querySelector('.edit-fields').remove();
    card.classList.remove('is-editing');
    card.querySelector('.event-content').hidden=false;
    card.querySelector('.time').hidden=false;
    card.querySelector('.tag').hidden=false;
    card.querySelector('.event-actions').innerHTML=`<button class="edit-event" type="button">編輯</button>`;
    return;
  }
  if(button.classList.contains('save-event')){
    const title=card.querySelector('[data-field="title"]').value.trim();
    const time=card.querySelector('[data-field="time"]').value;
    if(!title||!time){alert('請填寫行程名稱與時間。');return;}
    const detail=card.querySelector('[data-field="detail"]').value.trim();
    const category=card.querySelector('[data-field="category"]').value;
    card.dataset.title=title;card.dataset.time=time;card.dataset.detail=detail;card.dataset.category=category;
    card.querySelector('.time').textContent=time;
    card.querySelector('h3').textContent=title;
    card.querySelector('.detail').textContent=detail||'未填寫地點或備註';
    card.querySelector('.tag').textContent=category;
    card.querySelector('.event-actions').innerHTML=`<button class="edit-event" type="button" aria-label="編輯${escapeHtml(title)}">編輯</button>`;
    card.querySelector('.edit-fields').remove();
    card.classList.remove('is-editing');
    card.querySelector('.event-content').hidden=false;
    card.querySelector('.time').hidden=false;
    card.querySelector('.tag').hidden=false;
    [...scheduleList.querySelectorAll('.event')].sort((a,b)=>a.dataset.time.localeCompare(b.dataset.time)).forEach(item=>scheduleList.appendChild(item));
  }
});

// 待辦勾選後自動重排：未完成的在前，已完成的在後，並更新進度。
const taskList=document.getElementById('taskList');
const taskCount=document.getElementById('taskCount');
const progressLabel=document.getElementById('progressLabel');
const progressTrack=document.getElementById('progressTrack');
const progressFill=document.getElementById('progressFill');
function updateTasks(){
  const tasks=[...taskList.querySelectorAll('.task')];
  tasks.forEach(task=>{task.classList.toggle('is-complete',task.querySelector('input').checked);});
  tasks.sort((a,b)=>Number(a.querySelector('input').checked)-Number(b.querySelector('input').checked)).forEach(task=>taskList.appendChild(task));
  const completed=tasks.filter(task=>task.querySelector('input').checked).length;
  const percentage=tasks.length?Math.round(completed/tasks.length*100):0;
  taskCount.textContent=`${completed} / ${tasks.length}`;
  progressLabel.textContent=`${percentage}%`;
  progressFill.style.width=`${percentage}%`;
  progressTrack.setAttribute('aria-valuenow',String(percentage));
}
taskList.addEventListener('change',event=>{if(event.target.matches('input[type="checkbox"]'))updateTasks();});
updateTasks();
eventCount.textContent=`${scheduleList.querySelectorAll('.event').length} 筆`;
</script>
</body>
</html>
