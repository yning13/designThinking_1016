</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="mark">✦</span>日序 daymark</div><div class="label">工作空間</div><nav class="nav"><button class="active" data-view="today">◷　今日總覽</button><button data-view="week">▦　週曆</button><button data-view="tasks">☷　所有任務 <span class="count" id="all-count">0</span></button><button data-view="scheduled">↗　已排程</button></nav><div class="side-bottom"><div class="week-card"><small>本週任務完成率</small><strong id="week-rate">0%</strong><span id="week-note">完成一個任務，開始累積</span></div><div class="label">偏好設定</div><nav class="nav"><button id="clear-done">✓　清除已完成</button></nav><div class="side-foot">留一點空間，給重要的事。</div></div></aside><main class="main"><header class="top"><div class="crumb">個人工作空間　/　<b id="crumb">今日總覽</b></div><div class="topright"><span class="datechip" id="date-chip"></span><span class="avatar">林</span></div></header><div class="content"><section class="welcome"><div><div class="eyebrow" id="long-date"></div><h1 id="hello">早安，今天也加油 ☀</h1><p>把重要的事安排好，剩下的就一步一步來。</p></div><button class="primary" id="add">＋ 新增項目</button></section><section class="stats"><div class="stat"><div class="stat-label">今日行程 <i>◷</i></div><strong id="s-events">0<small>個安排</small></strong></div><div class="stat"><div class="stat-label">待辦任務 <i>✓</i></div><strong id="s-todo">0<small>項未完成</small></strong></div><div class="stat"><div class="stat-label">已完成 <i>✦</i></div><strong id="s-done">0<small>項完成</small></strong></div><div class="stat"><div class="stat-label">任務進度 <i>↗</i></div><strong id="s-progress">0/0<small>完成步驟</small></strong></div></section><div class="columns"><section class="panel"><div class="panel-head"><div><div class="panel-title" id="cal-title">日程安排</div><div class="panel-sub" id="cal-sub">今天的行程與已排程任務</div></div><div class="switch"><button class="active" data-cal="day">日</button><button data-cal="week">週</button></div></div><div id="day-view"><div class="month"><span id="month"></span><span class="arrows"><button i ue="0" required></div><div class="field task-field"><label for="steps-total">總步驟數</label><input id="steps-total" type="number" min="1" value="1" required></div><div class="field task-field"><label for="priority">優先程度</label><select id="priority"><option value="normal">一般</option><option value="high">高</option><option value="low">低</option></select></div></div><label class="checkline" id="repeat-line"><input id="repeat" type="checkbox"> 每週重複</label><div class="modal-footer"><button class="delete hidden" type="button" id="delete">刪除此項目</button><button class="save" type="submit">儲存項目</button></div></form></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],today=new Date();today.setHours(0,0,0,0);const key=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},shift=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(d),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected=new Date(today),view='today',cal='day',filter='all',editing=null,type='event',timer;function read(){try{return JSON.parse(localStorage.getItem('daymark-v1'))}catch{return null}}const seed=[{id:'a',type:'event',title:'晨間例行與本週規劃',date:key(today),time:'09:00',end:'09:30',notes:'確認本週的優先事項',repeat:true},{id:'b',type:'event',title:'產品設計同步會議',date:key(today),time:'10:30',end:'11:30',notes:'討論下一版使用流程'},{id:'c',type:'event',title:'午餐與散步',date:key(today),time:'12:00',end:'13:00',notes:'留點時間休息',color:'green'},{id:'d',type:'task',title:'整理使用者訪談摘要',date:key(today),time:'13:30',end:'14:30',notes:'彙整三位使用者的主要痛點',done:false,stepsDone:3,stepsTotal:5,priority:'high'},{id:'e',type:'task',title:'完成首頁版面草稿',date:key(today),time:'15:00',end:'16:00',notes:'完成桌機與手機主要區塊',done:false,stepsDone:1,stepsTotal:4},{id:'f',type:'todo',title:'回覆設計合作夥伴',date:key(today),notes:'確認下週可以討論的時段',done:false,stepsDone:0,stepsTotal:1,priority:'high'},{id:'g',type:'todo',title:'整理靈感與參考案例',date:key(shift(today,1)),notes:'收進專案資料夾',done:false,stepsDone:0,stepsTotal:3,priority:'low'},{id:'h',type:'event',title:'每週回顧',date:key(shift(today,2)),time:'16:00',end:'16:30',notes:'整理已完成與下週安排',repeat:true}];let items=read()||seed;const save=()=>localStorage.setItem('daymark-v1',JSON.stringify(items));function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2100)}function startWeek(d){let x=new Date(d);x.setDate(x.getDate()-x.getDay());return x}function dates(){return Array.from({length:7},(_,i)=>shift(startWeek(selected),i))}function onDate(i,d){return i.date===key(d)||(i.repeat&&new Date(i.date+'T00:00:00').getDay()===d.getDay()&&i.date<=key(d))}function scheduled(i){return i.type==='event'||(i.type==='task'&&!!i.time)}
function stats(){let todays=items.filter(i=>onDate(i,selected)),tasks=todays.filter(i=>i.type!=='event'),done=tasks.filter(i=>i.done),sd=tasks.reduce((a,i)=>a+(+i.stepsDone||0),0),st=tasks.reduce((a,i)=>a+(+i.stepsTotal||1),0);$('#s-events').innerHTML=`${todays.filter(i=>i.type==='event').length}<small>個安排</small>`;$('#s-todo').innerHTML=`${tasks.length-done.length}<small>項未完成</small>`;$('#s-done').innerHTML=`${done.length}<small>項完成</small>`;$('#s-progress').innerHTML=`${sd}/${st}<small>完成步驟</small>`;$('#all-count').textContent=items.filter(i=>i.type!=='event'&&!i.done).length;let week=items.filter(i=>i.type!=='event'&&dates().some(d=>onDate(i,d))),wd=week.filter(i=>i.done).length;$('#week-rate').textContent=week.length?`${Math.round(wd/week.length*100)}%`:'0%';$('#week-note').textContent=week.length?`${wd} / ${week.length} 項任務已完成`:'完成一個任務，開始累積'}
function renderDays(){let ds=dates();$('#month').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(selected);$('#days').innerHTML=ds.map(d=>`<button class="day ${key(d)===key(selected)?'selected':''}" data-date="${key(d)}"><span>${new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(d)}</span><b>${d.getDate()}</b><div class="dots">${items.filter(i=>onDate(i,d)).slice(0,3).map(i=>`<i class="${i.type==='event'?'':'todo'}"></i>`).join('')}</div></button>`).join('');$$('.day').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.date+'T00:00:00');render()});$('#agenda-label').textContent=key(selected)===key(today)?'今日時間軸':`${fmt(selected)}時間軸`}
function renderTimeline(){let list=items.filter(i=>scheduled(i)&&onDate(i,selected)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('#agenda-count').textContent=`${list.length} 個安排 · 可拖移調整`;document.querySelector('#timeline').innerHTML=list.length?list.map(i=>`<div class="row" draggable="true" data-drag-id="${i.id}"><div class="time">${esc(i.time||'全天')}${i.end?`<br>${esc(i.end)}`:''}</div><div class="rail"><i class="dot ${i.type==='task'||i.color==='green'?'green':''}"></i></div><div class="event"><span class="badge ${i.type==='task'?'task':''}">${i.type==='event'?(i.repeat?'每週重複':'行程'):'排程任務'}</span><button class="edit-inline" data-edit="${i.id}">編輯</button><div class="event-title">${esc(i.title)}</div><div class="event-meta">${esc(i.notes||(i.type==='task'?`${i.stepsDone}/${i.stepsTotal} 步驟完成`:'點擊編輯項目'))}</div></div></div>`).join(''):'<div class="empty">這天還沒有排程，新增一個行程或任務吧 ✨</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));initTimelineDrag()}
function renderWeek(){let ds=dates();$('#week-cols').innerHTML=ds.map(d=>{let list=items.filter(i=>scheduled(i)&&onDate(i,d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="week-col"><div class="week-col-head">${new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(d)}<b>${d.getDate()}</b></div>${list.length?list.map(i=>`<button class="week-item ${i.type==='task'?'task':''}" data-edit="${i.id}"><small>${esc(i.time||'全天')}</small>${esc(i.title)}</button>`).join(''):'<div class="empty" style="padding:20px 0">—</div>'}</div>`}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function renderTasks(){let list=items.filter(i=>i.type!=='event');if(view==='today')list=list.filter(i=>onDate(i,selected));if(view==='week')list=list.filter(i=>dates().some(d=>onDate(i,d)));if(view==='scheduled')list=list.filter(scheduled);list.sort((a,b)=>Number(a.done)-Number(b.done)||a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99'));$('#task-title').textContent={today:'今日任務',week:'本週任務',tasks:'所有任務',scheduled:'已排程任務'}[view];$('#task-sub').textContent=view==='week'?`本週 ${list.length} 項任務`:`${list.length} 項任務`;let completedSteps=list.reduce((sum,i)=>sum+Math.min(+i.stepsTotal||1,+i.stepsDone||0),0),totalSteps=list.reduce((sum,i)=>sum+(+i.stepsTotal||1),0);$('#daily-progress').innerHTML=list.length?`<span>整體進度</span><div class="track"><div class="fill" style="width:${Math.round(completedSteps/totalSteps*100)}%"></div></div><strong>${completedSteps}/${totalSteps}</strong>`:'<span>目前沒有任務進度</span>';$('#task-list').innerHTML=list.length?list.map(i=>{let n=+i.stepsTotal||1,d=Math.min(n,+i.stepsDone||0);return `<article class="task ${i.done?'done':''}"><div class="task-top"><input type="checkbox" class="check" data-check="${i.id}" aria-label="完成 ${esc(i.title)}" ${i.done?'checked':''}><div class="task-main"><div class="task-name">${esc(i.title)}</div><div class="task-meta"><i class="priority ${i.priority||''}"></i><span>${i.time?esc(i.time)+' · ':''}${fmt(new Date(i.date+'T00:00:00'))}</span><span>· ${i.done?'已完成':'待辦'}</span>${i.repeat?'<span>· 每週</span>':''}</div></div><button class="menu" data-edit="${i.id}" aria-label="編輯任務">···</button></div><div class="progress"><div class="track"><div class="fill" style="width:${Math.round(d/n*100)}%"></div></div><span class="fraction">${d}/${n}</span></div><div class="task-actions"><button class="small-btn" data-step="${i.id}">更新步驟</button><button class="small-btn" data-edit="${i.id}">編輯</button></div></article>`}).join(''):'<div class="empty">目前沒有符合條件的任務。<br>新增待辦，讓想法有個好開始。</div>';document.querySelec function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function addMinutes(t,n){let m=(minutes(t)+n+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}function initTimelineDrag(){let draggedId=null;document.querySelectorAll('#timeline [data-drag-id]').forEach(row=>{row.addEventListener('dragstart',e=>{draggedId=row.dataset.dragId;e.dataTransfer.setData('text/plain',draggedId);e.dataTransfer.effectAllowed='move';row.classList.add('dragging')});row.addEventListener('dragend',()=>{row.classList.remove('dragging');document.querySelectorAll('#timeline .drag-over').forEach(x=>x.classList.remove('drag-over'))});row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over')});row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drag-over');const from=e.dataTransfer.getData('text/plain')||draggedId,to=row.dataset.dragId;if(!from||from===to)return;const dragged=items.find(x=>x.id===from),target=items.find(x=>x.id===to);if(!dragged||!target)return;if(!dragged.time||!target.time){toast('全天項目請使用編輯調整時間');return}const ordered=items.filter(x=>scheduled(x)&&x.date===dragged.date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const fromIdx=ordered.findIndex(x=>x.id===from),toIdx=ordered.findIndex(x=>x.id===to),delta=toIdx-fromIdx;if(!delta)return;const duration=dragged.end?minutes(dragged.end)-minutes(dragged.time):60;const next=minutes(dragged.time)+delta*60;if(next<0||next+duration>1440){toast('調整後會超出當日時間範圍');return}const nextTime=addMinutes('00:00',next),oldTime=dragged.time;dragged.time=nextTime;if(dragged.end)dragged.end=addMinutes(nextTime,duration);const others=items.filter(x=>x.id!==dragged.id&&scheduled(x)&&x.date===dragged.date);const collision=others.find(x=>x.time&&next<minutes(x.end||addMinutes(x.time,60))&&next+duration>minutes(x.time));if(collision){const cDuration=collision.end?minutes(collision.end)-minutes(collision.time):60;dragged.time=collision.time;if(dragged.end)dragged.end=addMinutes(dragged.time,duration);collision.time=oldTime;if(collision.end)collision.end=addMinutes(oldTime,cDuration)}save();render();toast(collision?'時間已交換，原時長保留':'已調整時間（每個位置代表一小時）')})})}function render(){let d=selected;$('#date-chip').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'}).format(d);$('#long-date').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);$('#hello').textContent=key(d)===key(today)?'早安，今天也加油 ☀':`${new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(d)}，一步一步來 ✦`;$('#crumb').textContent={today:'今日總覽',week:'週曆',tasks:'所有任務',scheduled:'已排程'}[view];$('#cal-title').textContent=cal==='week'?'本週日程':'日程安排';$('#cal-sub').textContent=cal==='week'?'一週行程與排程任務':'今天的行程與已排程任務';$('#day-view').classList.toggle('hidden',cal==='week');$('#week-view').classList.toggle('hidden',cal!=='week');stats();renderDays();renderTimeline();renderWeek();renderTasks()}
function setView(v){view=v;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='week')cal='week';else if(v==='today')cal='day';$$('[data-cal]').forEach(b=>b.classList.toggle('active',b.dataset.cal===cal));render()}function openModal(t='event',item=null){editing=item?.id||null;type=item?.type||t;$('#modal-title').textContent=item?'編輯項目':'新增項目';$('#title').value=item?.title||'';$('#notes').value=item?.notes||'';$('#date').value=item?.date||key(selected);$('#time').value=item?.time||'';$('#end').value=item?.end||'';$('#steps-done').value=item?.stepsDone??0;$('#steps-total').value=item?.stepsTotal??1;$('#priority').value=item?.priority||'normal';$('#repeat').checked=!!item?.repeat;$('#delete').classList.toggle('hidden',!item);$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.type===type));$$('.tab').forEach(b=>b.classList.toggle('hidden',!!item));fields();$('#modal-bg').classList.remove('hidden');setTimeout(()=>$('#title').focus(),30)}function fields(){let task=type!=='event';$$('.task-field').forEach(e=>e.classList.toggle('hidden',!task));$$('.time-field,.end-field').forEach(e=>e.classList.toggle('hidden',type==='todo'));$('#repeat-line').classList.toggle('hidden',type==='todo');$('#time').required=type!=='todo';$('#end').required=type==='event';if(type==='todo'){$('#time').value='';$('#end').value=''}}function edit(id){let item=items.find(i=>i.id===id);if(item)openModal(item.type,item)}function close(){$('#modal-bg').classList.add('hidden');editing=null}
$('#tabs').onclick=e=>{let b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));fields()};$('#form').onsubmit=e=>{e.preventDefault();let total=Math.max(1,parseInt($('#steps-total').value)||1),completed=Math.max(0,Math.min(total,parseInt($('#steps-done').value)||0)),item={id:editing||String(Date.now()),type,title:$('#title').value.trim(),date:$('#date').value,time:type==='todo'?'':$('#time').value,end:type==='todo'?'':$('#end').value,notes:$('#notes').value.trim(),repeat:type==='todo'?false:$('#repeat').checked};if(type!=='event')Object.assign(item,{stepsDone:completed,stepsTotal:total,done:completed>=total,priority:$('#priority').value});else item.color='purple';let was=!!editing;if(was)items=items.map(i=>i.id===editing?item:i);else items.push(item);save();close();render();toast(was?'修改已儲存':'已新增項目')};$('#delete').onclick=()=>{let item=items.find(i=>i.id===editing);if(!confirm(`確定刪除「${item?.title||'此項目'}」嗎？`))return;items=items.filter(i=>i.id!==editing);save();close();render();toast('項目已刪除')};$('#add').onclick=()=>openModal();$('#close').onclick=close;$('#modal-bg').onclick=e=>{if(e.target===$('#modal-bg'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$$('[data-cal]').forEach(b=>b.onclick=()=>{cal=b.dataset.cal;$$('[data-cal]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#prev').onclick=()=>{selected=shift(selected,cal==='week'?-7:-1);render()};$('#next').onclick=()=>{selected=shift(selected,cal==='week'?7:1);render()};$('#clear-done').onclick=()=>{let n=items.filter(i=>i.type!=='event'&&i.done).length;if(!n){toast('目前沒有已完成任務');return}if(confirm(`確定清除 ${n} 項已完成任務嗎？`)){items=items.filter(i=>i.type==='event'||!i.done);save();render();toast('已清除完成任務')}};render()})();
